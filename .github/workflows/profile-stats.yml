name: Generate profile statistics

on:
  workflow_dispatch:
  schedule:
    # Daily at 12:27 in Japan (03:27 UTC).
    - cron: "27 3 * * *"

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate light and dark cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python3 scripts/generate_profile_stats.py \
            --theme light \
            --overview-output assets/overview.svg \
            --languages-output assets/languages.svg
          python3 scripts/generate_profile_stats.py \
            --theme dark \
            --overview-output assets/overview-dark.svg \
            --languages-output assets/languages-dark.svg

      - name: Commit changes when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/overview.svg \
            assets/overview-dark.svg \
            assets/languages.svg \
            assets/languages-dark.svg
          if git diff --cached --quiet; then
            echo "Profile statistics are already current."
            exit 0
          fi
          git commit -m "chore: refresh profile statistics"
          git push
