<svg xmlns="http://www.w3.org/2000/svg" width="680" height="210" viewBox="0 0 680 210" role="img" aria-labelledby="title desc">
  <title id="title">Languages in public repositories</title>
  <desc id="desc">Top programming languages calculated from GitHub Linguist code sizes across public, non-fork repositories.</desc>
  <style>
    .heading { font: 600 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #e6edf3; }
    .language { font: 500 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #e6edf3; }
    .percent, .note { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
  </style>
  <rect x="1" y="1" width="678" height="208" rx="12" fill="#0d1117" stroke="#30363d" />
  <text x="24" y="35" class="heading">Public repository language mix</text>
  <rect x="24" y="58" width="632" height="12" rx="6" fill="#21262d" />
  <clipPath id="bar"><rect x="24" y="58" width="632" height="12" rx="6" /></clipPath>
  <g clip-path="url(#bar)"><rect x="24.00" y="58" width="405.65" height="12" fill="#3572a5" /><rect x="429.65" y="58" width="107.10" height="12" fill="#3178c6" /><rect x="536.76" y="58" width="61.98" height="12" fill="#ff5a03" /><rect x="598.73" y="58" width="49.20" height="12" fill="#663399" /><rect x="647.93" y="58" width="4.92" height="12" fill="#89e051" /><rect x="652.85" y="58" width="3.15" height="12" fill="#41b883" /></g>
  <circle cx="30" cy="100" r="6" fill="#3572a5" /><text x="44" y="105" class="language">Python</text><text x="316" y="105" text-anchor="end" class="percent">63.8%</text><circle cx="350" cy="100" r="6" fill="#3178c6" /><text x="364" y="105" class="language">TypeScript</text><text x="636" y="105" text-anchor="end" class="percent">16.8%</text><circle cx="30" cy="134" r="6" fill="#ff5a03" /><text x="44" y="139" class="language">Astro</text><text x="316" y="139" text-anchor="end" class="percent">9.7%</text><circle cx="350" cy="134" r="6" fill="#663399" /><text x="364" y="139" class="language">CSS</text><text x="636" y="139" text-anchor="end" class="percent">7.7%</text><circle cx="30" cy="168" r="6" fill="#89e051" /><text x="44" y="173" class="language">Shell</text><text x="316" y="173" text-anchor="end" class="percent">0.8%</text><circle cx="350" cy="168" r="6" fill="#41b883" /><text x="364" y="173" class="language">Vue</text><text x="636" y="173" text-anchor="end" class="percent">0.5%</text>
  <text x="24" y="194" class="note">GitHub Linguist · code size · public non-fork repositories</text>
</svg>
