<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Chenqiang Zhang</title>
  <desc id="desc">An abstract constellation for learning, making, and writing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#10243d"/>
      <stop offset="1" stop-color="#17142f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63e6d7"/>
      <stop offset="0.5" stop-color="#72a8ff"/>
      <stop offset="1" stop-color="#f29bd5"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#60e5d4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#60e5d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b8d9ff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.4px; }
      .node { fill: #101d31; stroke-width: 1.5; }
      .wire { fill: none; stroke: url(#accent); stroke-width: 1.4; stroke-opacity: .52; stroke-dasharray: 4 9; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1020" cy="70" r="240" fill="url(#glow)" opacity=".6"/>
  <circle cx="80" cy="345" r="210" fill="url(#glow)" opacity=".2"/>
  <path d="M0 312 C210 276 330 352 540 306 S900 262 1200 318" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".35"/>

  <g transform="translate(72 76)">
    <text x="0" y="0" fill="#8da8c7" class="label">STUDENT · CURIOUS · STILL LEARNING</text>
    <text x="0" y="68" fill="#f4f8ff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="720" letter-spacing="-.8">Chenqiang Zhang</text>
    <rect x="0" y="91" width="455" height="3" rx="2" fill="url(#accent)"/>
    <text x="0" y="133" fill="#c9d8eb" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19">Learning, building &amp; writing along the way</text>
    <text x="0" y="176" fill="#7896b8" class="label">OSAKA, JAPAN  /  NOTES FROM THE PROCESS</text>
  </g>

  <g transform="translate(870 180)">
    <path id="p1" class="wire" d="M0 0 C-55 -35 -85 -72 -126 -98"/>
    <path id="p2" class="wire" d="M0 0 C65 -35 96 -62 135 -83"/>
    <path id="p3" class="wire" d="M0 0 C48 48 71 78 93 111"/>

    <g transform="translate(-126 -98)">
      <circle r="47" class="node" stroke="#63e6d7"/>
      <text text-anchor="middle" y="5" fill="#bff9f2" class="label">LEARN</text>
    </g>
    <g transform="translate(135 -83)">
      <circle r="47" class="node" stroke="#72a8ff"/>
      <text text-anchor="middle" y="5" fill="#c7dcff" class="label">MAKE</text>
    </g>
    <g transform="translate(93 111)">
      <circle r="47" class="node" stroke="#f29bd5"/>
      <text text-anchor="middle" y="5" fill="#ffd2ec" class="label">WRITE</text>
    </g>
    <circle r="68" fill="#101d31" stroke="url(#accent)" stroke-width="2.4"/>
    <circle r="54" fill="none" stroke="#d8e8ff" stroke-opacity=".12"/>
    <text text-anchor="middle" y="5" fill="#f4f8ff" class="label">HELLO</text>

    <circle class="motion" r="4" fill="#9ff4e9" filter="url(#softGlow)">
      <animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
    </circle>
    <circle class="motion" r="4" fill="#99bfff" filter="url(#softGlow)">
      <animateMotion dur="4.4s" begin="-.9s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
    </circle>
    <circle class="motion" r="4" fill="#ffc0e5" filter="url(#softGlow)">
      <animateMotion dur="4.1s" begin="-1.7s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion>
    </circle>
  </g>

  <circle cx="1140" cy="40" r="3" fill="#f29bd5"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1090" cy="325" r="2.5" fill="#63e6d7"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#a8c9ef" stroke-opacity=".14" stroke-width="2"/>
</svg>
