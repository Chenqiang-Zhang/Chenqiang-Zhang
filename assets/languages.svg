  <clipPath id="bar"><rect x="32" y="76" width="616" height="14" rx="7" /></clipPath>
  <g clip-path="url(#bar)"><rect x="32.00" y="76" width="219.74" height="14" fill="#3572a5" /><rect x="251.74" y="76" width="181.54" height="14" fill="#f1e05a" /><rect x="433.28" y="76" width="114.22" height="14" fill="#3178c6" /><rect x="547.51" y="76" width="30.33" height="14" fill="#ff5a03" /><rect x="577.83" y="76" width="28.30" height="14" fill="#663399" /><rect x="606.14" y="76" width="23.41" height="14" fill="#e34c26" /><rect x="629.55" y="76" width="15.77" height="14" fill="#41b883" /><rect x="645.32" y="76" width="2.41" height="14" fill="#89e051" /><rect x="647.72" y="76" width="1.00" height="14" fill="#1a7f37" /></g>
  <circle cx="39" cy="128" r="7" fill="#3572a5" /><text x="57" y="134" class="language">Python</text><text x="312" y="134" text-anchor="end" class="percent">35.67%</text><circle cx="349" cy="128" r="7" fill="#f1e05a" /><text x="367" y="134" class="language">JavaScript</text><text x="622" y="134" text-anchor="end" class="percent">29.47%</text><circle cx="39" cy="167" r="7" fill="#3178c6" /><text x="57" y="173" class="language">TypeScript</text><text x="312" y="173" text-anchor="end" class="percent">18.54%</text><circle cx="349" cy="167" r="7" fill="#ff5a03" /><text x="367" y="173" class="language">Astro</text><text x="622" y="173" text-anchor="end" class="percent">4.92%</text><circle cx="39" cy="206" r="7" fill="#663399" /><text x="57" y="212" class="language">CSS</text><text x="312" y="212" text-anchor="end" class="percent">4.59%</text><circle cx="349" cy="206" r="7" fill="#e34c26" /><text x="367" y="212" class="language">HTML</text><text x="622" y="212" text-anchor="end" class="percent">3.80%</text><circle cx="39" cy="245" r="7" fill="#41b883" /><text x="57" y="251" class="language">Vue</text><text x="312" y="251" text-anchor="end" class="percent">2.56%</text><circle cx="349" cy="245" r="7" fill="#89e051" /><text x="367" y="251" class="language">Shell</text><text x="622" y="251" text-anchor="end" class="percent">0.39%</text><circle cx="39" cy="284" r="7" fill="#1a7f37" /><text x="57" y="290" class="language">Dockerfile</text><text x="312" y="290" text-anchor="end" class="percent">0.04%</text>
