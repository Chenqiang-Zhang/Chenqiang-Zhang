<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-labelledby="title desc">
  <title id="title">Languages used by file size</title>
  <desc id="desc">Top languages calculated from GitHub Linguist code sizes across public, non-fork repositories.</desc>
  <style>
    .heading { font: 650 24px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #e6edf3; }
    .language { font: 600 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #e6edf3; }
    .percent { font: 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #8b949e; font-variant-numeric: tabular-nums; }
    .note { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
  </style>
  <rect x="1" y="1" width="678" height="358" rx="12" fill="#0d1117" stroke="#30363d" />
  <text x="32" y="52" class="heading">Languages Used (By File Size)</text>
